<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<link rel="stylesheet" href="formcss.css">
<body>
    <div id="app">
        <label>Judul Form dari parent</label>
        <input type="text" v-model="judulFormulir" placeholder="Masukkan judul formulir">
        <form-profile :title="judulFormulir"
            @form-submitted="saveData">
        </form-profile>
        <div style="margin-top: 20px;">
            <button @click="displayParentData" v-if="!showDataDisplay">Tampilkan dari parent</button>
            <button @click="hideParentData" v-if="showDataDisplay">Sembunyikan dari parent</button>
        </div>
        <div id="hasil-data" style="margin-top: 20px;" v-if="showDataDisplay">
            <h3>Hasil Data Lengkap</h3>
            <p v-if="parentData">
                Halo, nama saya {{ nama }} ({{ umur }} tahun), tinggal di {{ alamat }}.
            </p>
            <p v-else>
                Belum ada data yang disimpan.
            </p>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
<script src="formscript.js"></script>
</body>
</html>
